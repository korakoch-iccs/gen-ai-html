<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICCS Gen-AI Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f9;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 14px 18px 12px;
      background: #ffffff;
      border-bottom: 1px solid #dfe5ef;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      z-index: 1;
    }

    .tab-button {
      border: 1px solid #dfe5ef;
      background: #f6f8fb;
      color: #1f2937;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-button:hover {
      background: #edf3ff;
      border-color: #bfd1ff;
    }

    .tab-button.active {
      background: #482c77;
      border-color: #482c77;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(29, 78, 216, 0.2);
    }

    .content {
      position: relative;
      flex: 1;
      min-height: 0;
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.75);
      z-index: 2;
    }

    .content.loading .loading-overlay {
      display: flex;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 4px solid #dfe5ef;
      border-top-color: #482c77;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #ffffff;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="tab-bar" id="tabBar"></div>
  <div class="content" id="contentArea">
    <div class="loading-overlay" id="loadingOverlay" aria-live="polite" aria-label="Loading page">
      <div class="spinner" aria-hidden="true"></div>
    </div>
    <iframe
      id="pageFrame"
      title="ICCS page"
      width="600"
      height="100%"
      frameborder="0"
      style="border:0"
      allowfullscreen
      sandbox="allow-storage-access-by-user-activation allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox"
    ></iframe>
  </div>

  <script>
    const pages = [
      { label: 'Dashboard', file: 'https://lookerstudio.google.com/embed/reporting/ff35ed5e-ff75-428b-8123-dc1c42be584d/page/FeNYF' },
      { label: 'ข้อมูลนักศึกษา', file: 'ข้อมูลนักศึกษา สถาบันวิทยาลัยชุมชน.html' },
      { label: 'ข้อมูลสารสนเทศ', file: 'ข้อมูลสารสนเทศของนักศึกษา.html' },
      { label: 'สถิติ ThaiMOOC', file: 'สถิติการใช้งาน ICCS ThaiMOOC.html' }
    ];

    const tabBar = document.getElementById('tabBar');
    const pageFrame = document.getElementById('pageFrame');
    const contentArea = document.getElementById('contentArea');

    function setLoading(isLoading) {
      contentArea.classList.toggle('loading', isLoading);
    }

    pageFrame.addEventListener('load', () => {
      setLoading(false);
    });

    pageFrame.addEventListener('error', () => {
      setLoading(false);
    });

    pages.forEach((page, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab-button';
      button.textContent = page.label;
      button.setAttribute('aria-label', 'Open ' + page.label);
      button.addEventListener('click', () => loadPage(index));
      tabBar.appendChild(button);
    });

    function loadPage(index) {
      const page = pages[index];
      if (!page) return;

      const buttons = document.querySelectorAll('.tab-button');
      buttons.forEach((button, buttonIndex) => {
        button.classList.toggle('active', buttonIndex === index);
      });

      setLoading(true);
      pageFrame.src = encodeURI(page.file);
      pageFrame.title = page.label;
    }

    setLoading(true);
    loadPage(0);
  </script>
</body>
</html>
